# ML Factory - single service: FastAPI serves the API and the built React UI.
#
# This is the only thing that runs outside AWS. Datasets, artifacts, experiment records and
# every ML workload live in S3 / SageMaker / Step Functions.
#
# Run: docker compose up -d --build   (then open http://<host>:7570)

services:
  ml-factory:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
    container_name: ml_factory
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8520
    ports:
      - "7570:8520"
    environment:
      PYTHONPATH: /app
      http_proxy: ${http_proxy:-}
      https_proxy: ${https_proxy:-}
      # Loopback and internal hosts must bypass the proxy.
      no_proxy: ${no_proxy:-localhost,127.0.0.1}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1}
      ML_FACTORY_LOG_LEVEL: ${ML_FACTORY_LOG_LEVEL:-INFO}
      # Everything else - the artifact bucket, the state machines, the dataset allow-list and
      # the credentials - comes from config/secrets/config.py, mounted below.
      ML_FACTORY_AWS_REGION: ${ML_FACTORY_AWS_REGION:-eu-central-1}
    volumes:
      # The platform's configuration, exactly as .env.example documents it.
      - ./.env:/app/.env:ro
      # Credentials. The directory is mounted, so it works before config.py exists;
      # config/secrets/config.py is gitignored and read-only in the container.
      - ./config/secrets:/app/config/secrets:ro
      # Uncomment to use the server's shared AWS credentials instead of an instance role
      # or the keys in config/secrets/config.py.
      # - ${HOME}/.aws:/home/mlfactory/.aws:ro
    networks:
      - dev_network
    restart: unless-stopped

networks:
  dev_network:
    external: true
