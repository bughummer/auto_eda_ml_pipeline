[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-factory"
version = "1.0.0"
description = "Internal ML Factory: automated EDA, leakage screening and classical-ML baselines"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "pyarrow>=17.0",
    "joblib>=1.4",
]

[project.optional-dependencies]
backend = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "boto3>=1.35", "python-multipart>=0.0.9"]
models = ["xgboost>=2.1", "catboost>=1.2"]
dictionary = ["openpyxl>=3.1"]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.6", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["ml_engine*", "backend*", "jobs*"]
exclude = ["tests*", "frontend*", "infrastructure*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "frontend", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF", "N", "ARG", "PTH"]
ignore = ["N818", "RUF012", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "E501"]
# scikit-learn's transformer API fixes these signatures: capital X, and a y that
# stateless transformers ignore.
"ml_engine/preprocessing/transformers.py" = ["N803", "ARG002"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:Using `httpx` with `starlette.testclient`:UserWarning",
]
markers = ["slow: long-running end-to-end tests"]
