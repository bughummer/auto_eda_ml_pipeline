AWSTemplateFormatVersion: '2010-09-09'
Description: >
  ML Factory - artifact storage, IAM boundaries and the two Step Functions workflows.
  Experiment records live in the artifact bucket with everything else, so there is no state
  database. Deliberately contains no always-on compute: every ML workload is an ephemeral
  SageMaker job started by a workflow.

  Each of the three runtime roles (backend, workflow, job) is created by this template by
  default. Supply its ARN via the matching Existing*RoleArn parameter instead to have the
  stack reference a role you created and reviewed yourself; the template then does not create,
  own, or attach any policy to that role, so its permissions must already match the reference
  policy in infrastructure/iam/ (backend_role_policy.json, workflow_role_policy.json,
  job_role_policy.json) with the placeholders filled in for this deployment. Mixing the two —
  some roles created here, others supplied — is fine; each is independent.

Parameters:
  ArtifactBucketName:
    Type: String
    Description: Bucket that stores experiment artifacts (created by this template).
  ApprovedDataBucketName:
    Type: String
    Description: Existing bucket holding approved datasets. Read-only for the platform.
  ApprovedDataPrefix:
    Type: String
    Default: curated
    Description: Only this prefix of the approved bucket may be used as a dataset source.
  JobImageUri:
    Type: String
    Description: ECR image URI built from infrastructure/docker/Dockerfile.
  DefinitionsBucket:
    Type: String
    Description: Bucket holding the uploaded Step Functions definitions.
  EdaDefinitionKey:
    Type: String
    Default: ml-factory/stepfunctions/eda_state_machine.asl.json
  TrainingDefinitionKey:
    Type: String
    Default: ml-factory/stepfunctions/training_state_machine.asl.json
  ProcessingInstanceType:
    Type: String
    Default: ml.m5.large
  TrainingInstanceType:
    Type: String
    Default: ml.m5.large
  MaxParallelTrainingJobs:
    Type: Number
    Default: 4
  MaxRuntimeSeconds:
    Type: Number
    Default: 7200
  BedrockModelId:
    Type: String
    Default: ''
    Description: >-
      The one foundation model the control plane may invoke, e.g.
      anthropic.claude-3-5-sonnet-20241022-v2:0. Left empty, MlFactoryBackendRole is granted no
      bedrock:InvokeModel at all — the LLM is optional, and no wildcard stands in for a model
      nobody named.
  ExistingBackendRoleArn:
    Type: String
    Default: ''
    Description: >-
      Leave empty to have this stack create MlFactoryBackendRole. Set to an existing role's
      ARN to use that role instead — its permissions must already match
      infrastructure/iam/backend_role_policy.json; this template will not attach anything to it.
  ExistingWorkflowRoleArn:
    Type: String
    Default: ''
    Description: >-
      Leave empty to have this stack create MlFactoryWorkflowRole. Set to an existing role's
      ARN to use that role instead — its permissions must already match
      infrastructure/iam/workflow_role_policy.json; this template will not attach anything to it.
  ExistingJobRoleArn:
    Type: String
    Default: ''
    Description: >-
      Leave empty to have this stack create MlFactoryJobRole. Set to an existing role's ARN to
      use that role instead — its permissions must already match
      infrastructure/iam/job_role_policy.json; this template will not attach anything to it.

Conditions:
  GrantBedrock: !Not [!Equals [!Ref BedrockModelId, '']]
  CreateBackendRole: !Equals [!Ref ExistingBackendRoleArn, '']
  CreateWorkflowRole: !Equals [!Ref ExistingWorkflowRoleArn, '']
  CreateJobRole: !Equals [!Ref ExistingJobRoleArn, '']

Resources:
  ArtifactKey:
    Type: AWS::KMS::Key
    Properties:
      Description: ML Factory artifact and experiment-record encryption
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AccountRoot
            Effect: Allow
            Principal: { AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root' }
            Action: 'kms:*'
            Resource: '*'

  ArtifactKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/ml-factory
      TargetKeyId: !Ref ArtifactKey

  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref ArtifactBucketName
      VersioningConfiguration: { Status: Enabled }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !Ref ArtifactKey
            BucketKeyEnabled: true

  JobRole:
    Type: AWS::IAM::Role
    Condition: CreateJobRole
    Properties:
      RoleName: MlFactoryJobRole
      Description: Assumed by the ephemeral SageMaker containers.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: sagemaker.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: MlFactoryJobPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ['s3:GetObject', 's3:GetObjectVersion']
                Resource: !Sub 'arn:aws:s3:::${ApprovedDataBucketName}/${ApprovedDataPrefix}/*'
              - Effect: Allow
                Action: ['s3:ListBucket']
                Resource: !Sub 'arn:aws:s3:::${ApprovedDataBucketName}'
                Condition:
                  StringLike: { 's3:prefix': [!Sub '${ApprovedDataPrefix}/*'] }
              - Effect: Allow
                Action: ['s3:GetObject', 's3:PutObject']
                Resource: !Sub 'arn:aws:s3:::${ArtifactBucketName}/ml-factory/experiments/*'
              - Effect: Allow
                Action: ['s3:ListBucket']
                Resource: !Sub 'arn:aws:s3:::${ArtifactBucketName}'
              - Effect: Allow
                Action: ['kms:Decrypt', 'kms:GenerateDataKey']
                Resource: !GetAtt ArtifactKey.Arn
              - Effect: Allow
                Action:
                  - 'logs:CreateLogGroup'
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                  - 'logs:DescribeLogStreams'
                  - 'cloudwatch:PutMetricData'
                Resource: '*'
              - Effect: Allow
                Action:
                  - 'ecr:GetAuthorizationToken'
                  - 'ecr:BatchCheckLayerAvailability'
                  - 'ecr:GetDownloadUrlForLayer'
                  - 'ecr:BatchGetImage'
                Resource: '*'

  WorkflowRole:
    Type: AWS::IAM::Role
    Condition: CreateWorkflowRole
    Properties:
      RoleName: MlFactoryWorkflowRole
      Description: Assumed by Step Functions. Creates ephemeral jobs; holds no data access.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: states.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: MlFactoryWorkflowPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'sagemaker:CreateProcessingJob'
                  - 'sagemaker:DescribeProcessingJob'
                  - 'sagemaker:StopProcessingJob'
                  - 'sagemaker:CreateTrainingJob'
                  - 'sagemaker:DescribeTrainingJob'
                  - 'sagemaker:StopTrainingJob'
                  - 'sagemaker:AddTags'
                Resource:
                  - !Sub 'arn:aws:sagemaker:${AWS::Region}:${AWS::AccountId}:processing-job/mlf-*'
                  - !Sub 'arn:aws:sagemaker:${AWS::Region}:${AWS::AccountId}:training-job/mlf-*'
              - Effect: Allow
                Action: ['events:PutTargets', 'events:PutRule', 'events:DescribeRule']
                Resource: !Sub 'arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/StepFunctionsGetEventsForSageMaker*Rule'
              - Effect: Allow
                Action: ['iam:PassRole']
                Resource: !If [CreateJobRole, !GetAtt JobRole.Arn, !Ref ExistingJobRoleArn]
                Condition:
                  StringEquals: { 'iam:PassedToService': sagemaker.amazonaws.com }
              # Stage transitions are written as state/workflow.json beside the artifacts.
              - Effect: Allow
                Action: ['s3:PutObject']
                Resource: !Sub 'arn:aws:s3:::${ArtifactBucketName}/ml-factory/experiments/*/state/*'
              - Effect: Allow
                Action: ['kms:Decrypt', 'kms:GenerateDataKey']
                Resource: !GetAtt ArtifactKey.Arn
              # Step Functions' own logging, per LoggingConfiguration below. The vended-log
              # delivery APIs have no resource-level form, so AWS requires these on '*' — and
              # without them the state machines fail to create at all, not merely to log.
              - Effect: Allow
                Action:
                  - 'logs:CreateLogDelivery'
                  - 'logs:GetLogDelivery'
                  - 'logs:UpdateLogDelivery'
                  - 'logs:DeleteLogDelivery'
                  - 'logs:ListLogDeliveries'
                  - 'logs:PutResourcePolicy'
                  - 'logs:DescribeResourcePolicies'
                  - 'logs:DescribeLogGroups'
                Resource: '*'

  BackendRole:
    Type: AWS::IAM::Role
    Condition: CreateBackendRole
    Properties:
      RoleName: MlFactoryBackendRole
      Description: >
        Assumed by the FastAPI control plane running on the corporate server. It can start
        workflows and read artifacts, but cannot create SageMaker jobs itself. Trusted via
        sts:AssumeRole from this account, so the deployment credentials the container is given
        are an IAM principal that assumes this role rather than one carrying these permissions
        directly.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root' }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: MlFactoryBackendPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ['states:StartExecution', 'states:DescribeExecution', 'states:ListExecutions']
                Resource:
                  - !Ref EdaStateMachine
                  - !Ref TrainingStateMachine
                  - !Sub 'arn:aws:states:${AWS::Region}:${AWS::AccountId}:execution:ml-factory-*:*'
              - Effect: Allow
                Action: ['s3:GetObject', 's3:PutObject']
                Resource: !Sub 'arn:aws:s3:::${ArtifactBucketName}/ml-factory/experiments/*'
              - Effect: Allow
                Action: ['s3:ListBucket']
                Resource: !Sub 'arn:aws:s3:::${ArtifactBucketName}'
              - Effect: Allow
                Action: ['s3:GetObject', 's3:ListBucket']
                Resource:
                  - !Sub 'arn:aws:s3:::${ApprovedDataBucketName}'
                  - !Sub 'arn:aws:s3:::${ApprovedDataBucketName}/${ApprovedDataPrefix}/*'
              - Effect: Allow
                Action: ['kms:Decrypt', 'kms:GenerateDataKey']
                Resource: !GetAtt ArtifactKey.Arn
              # One model, named at deploy time. Left empty, the control plane gets no Bedrock
              # access at all rather than a wildcard over every foundation model.
              - !If
                - GrantBedrock
                - Effect: Allow
                  Action: ['bedrock:InvokeModel']
                  Resource: !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/${BedrockModelId}'
                - !Ref 'AWS::NoValue'

  WorkflowLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/vendedlogs/states/ml-factory
      RetentionInDays: 90

  EdaStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: ml-factory-eda
      RoleArn: !If [CreateWorkflowRole, !GetAtt WorkflowRole.Arn, !Ref ExistingWorkflowRoleArn]
      DefinitionS3Location:
        Bucket: !Ref DefinitionsBucket
        Key: !Ref EdaDefinitionKey
      DefinitionSubstitutions:
        JobRoleArn: !If [CreateJobRole, !GetAtt JobRole.Arn, !Ref ExistingJobRoleArn]
        JobImageUri: !Ref JobImageUri
        ProcessingInstanceType: !Ref ProcessingInstanceType
        ProcessingInstanceCount: '1'
        ProcessingVolumeSizeGb: '30'
        MaxRuntimeSeconds: !Ref MaxRuntimeSeconds
        KmsKeyId: !GetAtt ArtifactKey.Arn
      LoggingConfiguration:
        Level: ERROR
        IncludeExecutionData: false
        Destinations:
          - CloudWatchLogsLogGroup: { LogGroupArn: !GetAtt WorkflowLogGroup.Arn }

  TrainingStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: ml-factory-training
      RoleArn: !If [CreateWorkflowRole, !GetAtt WorkflowRole.Arn, !Ref ExistingWorkflowRoleArn]
      DefinitionS3Location:
        Bucket: !Ref DefinitionsBucket
        Key: !Ref TrainingDefinitionKey
      DefinitionSubstitutions:
        JobRoleArn: !If [CreateJobRole, !GetAtt JobRole.Arn, !Ref ExistingJobRoleArn]
        JobImageUri: !Ref JobImageUri
        ProcessingInstanceType: !Ref ProcessingInstanceType
        ProcessingInstanceCount: '1'
        ProcessingVolumeSizeGb: '30'
        TrainingInstanceType: !Ref TrainingInstanceType
        TrainingInstanceCount: '1'
        TrainingVolumeSizeGb: '30'
        MaxParallelTrainingJobs: !Ref MaxParallelTrainingJobs
        MaxRuntimeSeconds: !Ref MaxRuntimeSeconds
        KmsKeyId: !GetAtt ArtifactKey.Arn
        AwsRegion: !Ref 'AWS::Region'
      LoggingConfiguration:
        Level: ERROR
        IncludeExecutionData: false
        Destinations:
          - CloudWatchLogsLogGroup: { LogGroupArn: !GetAtt WorkflowLogGroup.Arn }

Outputs:
  ArtifactBucketUri:
    Description: Value for ML_FACTORY_ARTIFACT_BUCKET
    Value: !Sub 's3://${ArtifactBucketName}'
  EdaStateMachineArn:
    Description: Value for ML_FACTORY_EDA_STATE_MACHINE_ARN
    Value: !Ref EdaStateMachine
  TrainingStateMachineArn:
    Description: Value for ML_FACTORY_TRAINING_STATE_MACHINE_ARN
    Value: !Ref TrainingStateMachine
  BackendRoleArn:
    Description: Role the control plane assumes via STS from the corporate server
    Value: !If [CreateBackendRole, !GetAtt BackendRole.Arn, !Ref ExistingBackendRoleArn]
  KmsKeyId:
    Description: Value for ML_FACTORY_KMS_KEY_ID
    Value: !Ref ArtifactKey
